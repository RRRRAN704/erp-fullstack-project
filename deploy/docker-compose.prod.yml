# Production stack on the EC2 host (1 GB RAM): Caddy (HTTPS + both frontends) -> Spring Boot API -> MySQL + Redis.
# Only the web container publishes ports; the API, MySQL and Redis are reachable only inside this compose network.
# Secrets come from a .env file next to this one on the server (see .env.example); it is never committed.
# The seed file erp_project.sql must sit next to this file; MySQL runs it once, on an empty data volume.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: erp_project
      MYSQL_USER: erp
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      TZ: Europe/London
    # MySQL's defaults assume a dedicated server; shrink them for a 1 GB host.
    command:
      - --innodb-buffer-pool-size=64M
      - --innodb-log-buffer-size=8M
      - --performance-schema=OFF
      - --max-connections=30
      - --table-open-cache=200
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --skip-name-resolve
    volumes:
      - mysql_data:/var/lib/mysql
      - ./erp_project.sql:/docker-entrypoint-initdb.d/01-erp_project.sql:ro
    mem_limit: 320m
    healthcheck:
      # TCP (127.0.0.1), not the socket: during first-time init MySQL runs without networking,
      # so this only passes once the seed data is loaded and the real server is up.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis only holds short-lived data (email codes, cache), so a small LRU cap is enough.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}",
              "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}   # lets the health check authenticate without a password on the command line
    mem_limit: 48m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/rrrran704/erp-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      TZ: Europe/London
      # Each ERP_X_Y fills the ${erp.x.y} placeholders in application.yml.
      ERP_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      ERP_DATASOURCE_HOST: mysql
      ERP_DATASOURCE_PORT: "3306"
      ERP_DATASOURCE_DATABASE: erp_project
      ERP_DATASOURCE_USERNAME: erp
      ERP_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      ERP_REDIS_HOST: redis
      ERP_REDIS_PORT: "6379"
      ERP_REDIS_PASSWORD: ${REDIS_PASSWORD}
      ERP_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ERP_MAIL_HOST: ${MAIL_HOST:?set MAIL_HOST in .env}
      ERP_MAIL_PORT: ${MAIL_PORT:-587}
      ERP_MAIL_USERNAME: ${MAIL_USERNAME:?set MAIL_USERNAME in .env}
      ERP_MAIL_PASSWORD: ${MAIL_PASSWORD:?set MAIL_PASSWORD in .env}
      ERP_MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:?set MAIL_FROM_EMAIL in .env}
      ERP_ALIOSS_ENDPOINT: ${OSS_ENDPOINT:?set OSS_ENDPOINT in .env}
      ERP_ALIOSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?set OSS_ACCESS_KEY_ID in .env}
      ERP_ALIOSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?set OSS_ACCESS_KEY_SECRET in .env}
      ERP_ALIOSS_BUCKET_NAME: ${OSS_BUCKET_NAME:?set OSS_BUCKET_NAME in .env}
      ERP_LLM_BASE_URL: ${LLM_BASE_URL:?set LLM_BASE_URL in .env}
      ERP_LLM_MODEL: ${LLM_MODEL:?set LLM_MODEL in .env}
      ERP_LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
    mem_limit: 448m
    # Lets `docker compose up --wait` (used by the deploy) know when the new version is really serving.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8091/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging

  web:
    image: ${WEB_IMAGE:-ghcr.io/rrrran704/erp-web}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Real hostnames: Caddy gets Let's Encrypt certificates for them automatically.
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      ERP_ADDRESS: ${ERP_ADDRESS:?set ERP_ADDRESS in .env}
    volumes:
      - caddy_data:/data      # TLS certificates; keep them so restarts don't hit Let's Encrypt rate limits
      - caddy_config:/config
    mem_limit: 64m
    depends_on:
      - backend
    logging: *logging

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
