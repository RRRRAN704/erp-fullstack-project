# Test profile: the database and Redis addresses come from Testcontainers (see IntegrationTestBase).
# Everything else gets harmless dummy values, so tests never reach real SMTP, OSS or LLM services.
erp:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jwt:
    secret: test-only-secret-that-is-at-least-32-characters-long
  mail:
    host: localhost
    port: 2525
    username: test
    password: test
    from-email: test@example.com
  alioss:
    endpoint: oss.example.com
    access-key-id: test
    access-key-secret: test
    bucket-name: test
  llm:
    base-url: http://localhost:9
    model: test
    api-key: test
