# CI: build both Docker images on every change; on main, push them to GHCR.
#   ghcr.io/rrrran704/erp-backend   Spring Boot API        (erp-backend/Dockerfile)
#   ghcr.io/rrrran704/erp-web       Caddy + both frontends  (deploy/web/Dockerfile)
# Each image is tagged with the commit SHA (what production runs) and "latest".
# Tests and the EC2 deploy job will be added in later steps.
name: Build

on:
  push:
    branches: [main]
    paths:
      - "erp-backend/**"
      - "erp-frontend/**"
      - "website-frontend/**"
      - "deploy/web/**"
      - ".dockerignore"
      - ".github/workflows/build.yml"
  pull_request:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: erp-backend
            context: erp-backend
            dockerfile: erp-backend/Dockerfile
          - name: erp-web
            context: .
            dockerfile: deploy/web/Dockerfile
    env:
      IMAGE: ghcr.io/rrrran704/${{ matrix.name }}
      # Push only for main; pull requests just prove the image still builds.
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64    # the EC2 server is x86
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # Links the package to this repo, so this repo's GITHUB_TOKEN can pull it in the deploy job.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # Reuse layers (Maven and npm dependencies) between runs; one cache per image.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
