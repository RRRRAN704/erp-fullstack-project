# CI: build both Docker images on every change; on main, push them to GHCR.
#   ghcr.io/rrrran704/erp-backend   Spring Boot API        (erp-backend/Dockerfile)
#   ghcr.io/rrrran704/erp-web       Caddy + both frontends  (deploy/web/Dockerfile)
# Each image is tagged with the commit SHA (what production runs) and "latest".
# On main, the deploy job then rolls the new SHA out to EC2 (see the comment on that job).
name: Build

on:
  push:
    branches: [main]
    paths:
      - "erp-backend/**"
      - "erp-frontend/**"
      - "website-frontend/**"
      - "deploy/web/**"
      - ".dockerignore"
      - "deploy/docker-compose.prod.yml"
      - ".github/workflows/build.yml"
  pull_request:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: erp-backend
            context: erp-backend
            dockerfile: erp-backend/Dockerfile
          - name: erp-web
            context: .
            dockerfile: deploy/web/Dockerfile
    env:
      IMAGE: ghcr.io/rrrran704/${{ matrix.name }}
      # Push only for main; pull requests just prove the image still builds.
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64    # the EC2 server is x86
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # Links the package to this repo, so this repo's GITHUB_TOKEN can pull it in the deploy job.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # Reuse layers (Maven and npm dependencies) between runs; one cache per image.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Deploy uses no long-lived credentials:
  #   - GitHub's OIDC token is exchanged for a short-lived AWS role (AWS_DEPLOY_ROLE_ARN), which is allowed
  #     only from this repo's main branch and only to run commands on one instance through SSM.
  #   - SSM's agent on the server connects outbound to AWS, so no SSH port is needed.
  #   - The images are public on GHCR, so the server pulls them without logging in.
  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production   # never run two deploys at once
    permissions:
      contents: read
      id-token: write         # lets the job request a GitHub OIDC token for AWS
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Deploy on EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TAG: ${{ github.sha }}
          COMPOSE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/deploy/docker-compose.prod.yml
        run: |
          # Runs as root in /opt/erp. Takes the compose file from this exact commit, switches IMAGE_TAG,
          # and only restarts what changed (normally backend + web; MySQL and Redis keep running).
          # If the new version fails its health check, the previous compose file and tag are restored.
          params=$(jq -n --arg tag "$TAG" --arg url "$COMPOSE_URL" '{
            executionTimeout: ["600"],
            commands: [
              "set -eu",
              "cd /opt/erp",
              "prev=$(sed -n \"s/^IMAGE_TAG=//p\" .env)",
              "cp docker-compose.yml docker-compose.yml.prev",
              "curl -fsSL -o docker-compose.yml \($url | @sh)",
              "sed -i \"s/^IMAGE_TAG=.*/IMAGE_TAG=\($tag)/\" .env",
              "docker compose pull backend web",
              "if ! docker compose up -d --wait --wait-timeout 240; then echo \"New version unhealthy, rolling back to $prev\"; docker compose logs --tail 80 backend web; cp docker-compose.yml.prev docker-compose.yml; sed -i \"s/^IMAGE_TAG=.*/IMAGE_TAG=$prev/\" .env; docker compose up -d --wait --wait-timeout 240; exit 1; fi",
              "docker image prune -af --filter until=168h >/dev/null",
              "echo \"Deployed \($tag)\""
            ]}')
          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${TAG::7}" \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command $id"

          for i in $(seq 1 120); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Status: $status"
          [ "$status" = Success ]

      - name: Smoke test
        run: |
          curl -fsS --retry 5 --retry-delay 3 -o /dev/null https://flowbiterp.site/
          curl -fsS --retry 5 --retry-delay 3 -o /dev/null https://erp.flowbiterp.site/
